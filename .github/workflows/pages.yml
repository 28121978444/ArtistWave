name: Deploy ArtistWave to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript and website files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s cloud-sync.js
          test -s studio.js
          test -s navigation.js
          test -s playlists.js
          test -s mini-player.html
          test -s mini-player.css
          test -s mini-player-host.js
          test -s mini-player.js
          test -s theme.js
          test -s install.js
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon-192.png
          test -s icon-512.png
          node --check app.js
          node --check cloud-sync.js
          node --check studio.js
          node --check navigation.js
          node --check playlists.js
          node --check mini-player-host.js
          node --check mini-player.js
          node --check theme.js
          node --check install.js
          node --check sw.js
          node -e "const m=JSON.parse(require('node:fs').readFileSync('manifest.webmanifest')); if(m.scope!=='/ArtistWave/'||m.display!=='standalone')process.exit(1)"
          node --test tests/*.test.cjs

      - name: Prepare static website
        run: |
          mkdir -p site
          cp index.html app.js cloud-sync.js studio.js navigation.js playlists.js mini-player.html mini-player.css mini-player-host.js mini-player.js theme.js install.js sw.js manifest.webmanifest icon-192.png icon-512.png styles.css site/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
